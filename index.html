<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Claude Holiday Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style id="css">
/* VOICE everyday learning, encouraging, clear working parts
   IDEA a trail map: ten stations on one route, each filling as it is completed
   PICTURE the route of 11 stops across a cobalt band, rings fill with sunflower as tasks are ticked
   COLOUR white ground, cobalt band, sunflower for done, ink navy
   TYPE Archivo 800 display + Inter text
   LAYOUT title and overall progress over the full-width trail; one calm column of topics below; phone stacks title, trail, week */
:root{color-scheme:light;--bg:light-dark(#ffffff,#0f1324);--ink:light-dark(#14172b,#eef0fa);--mute:light-dark(#525873,#a9afca);--band:light-dark(#2747d6,#17246b);--sun:#ffc21a;--line:light-dark(#dde2f0,#2a3152);--soft:light-dark(#f3f5fc,#161b31);--link:light-dark(#2747d6,#9db0ff)}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
a{color:var(--link)}
button{font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.band{padding-block:clamp(24px,4vw,56px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.top{background:var(--band);color:#fff;padding-bottom:20px}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 48px;align-items:end}
h1{font-size:clamp(34px,5vw,52px)}
.lede{margin:12px 0 0;max-width:60ch;color:#e3e8ff}
.sum{min-width:220px}
.big{font:800 clamp(40px,5vw,56px)/1 Archivo,sans-serif}
.sum p{margin:6px 0 0;color:#e3e8ff}
.bar{height:10px;border-radius:5px;background:rgba(127,140,190,.28);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--sun);border-radius:5px;transition:width .4s}
.top .bar{background:rgba(255,255,255,.22)}
.save{font-size:14px}
.trail{overflow-x:auto;margin-top:28px;padding-bottom:6px}
.trail ol{list-style:none;margin:0;padding:0;display:flex;max-width:1240px;margin-inline:auto}
.trail li{flex:1 0 100px;position:relative;text-align:center}
.trail li+li::before{content:"";position:absolute;top:31px;left:-50%;width:100%;height:4px;background:rgba(255,255,255,.3);z-index:0}
.trail li.full+li::before,.trail li.full::before{background:var(--sun)}
.stop{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;text-decoration:none;padding:0 4px 4px;position:relative;z-index:1}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sun) calc(var(--p)*1%),rgba(255,255,255,.22) 0)}
.num{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--band);font:800 20px Archivo,sans-serif}
.stop.on .ring{box-shadow:0 0 0 4px #fff}
.stop.on .lbl{font-weight:600;color:#fff}
.lbl{font-size:13px;line-height:1.3;color:#dfe5ff;max-width:12ch}
.wk{max-width:900px;margin:0 auto}
.wn{margin:0 0 8px;color:var(--mute);font-weight:600}
h2{font-size:clamp(32px,4.4vw,46px)}
.goal{font-size:17px;margin:14px 0 0;max-width:65ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:12px 24px;margin:20px 0 0}
.facts div{border-top:2px solid var(--line);padding-top:8px}
.facts dt{font-size:13px;color:var(--mute)}
.facts dd{margin:2px 0 0;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.hot{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.topic{margin-top:32px;padding:24px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.th{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h3{font-size:24px}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sun);color:#14172b;white-space:nowrap}
.why{margin:10px 0 0;max-width:68ch}
.tasks{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.tasks li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;border-bottom:1px solid var(--line);padding:4px 0}
.tasks label{flex:1 1 300px;display:flex;gap:14px;align-items:flex-start;padding:10px 0;cursor:pointer}
.tasks input{appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--mute);border-radius:7px;background:var(--bg);display:grid;place-items:center;cursor:pointer}
.tasks input:checked{background:var(--sun);border-color:var(--sun)}
.tasks input:checked::after{content:"";width:7px;height:13px;border:solid #14172b;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.tasks li.done label span{color:var(--mute)}
.meta{display:flex;gap:10px;align-items:center;margin-left:40px}
.cnt{font-size:13px;color:var(--mute);white-space:nowrap}
.rs{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.rs:hover{border-color:var(--ink)}
.res{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.res a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--link);text-decoration:none;font-size:15px;font-weight:600}
.res a::after{content:"\2197";margin-left:6px;font-size:13px}
.res a:hover{background:var(--link);color:var(--bg)}
.check{margin-top:32px;padding:24px;border-radius:16px;border:2px dashed var(--line)}
.check ul{margin:12px 0 0;padding-left:20px}
.check li{margin:6px 0}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:32px;flex-wrap:wrap}
.pn a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:12px;background:var(--band);color:#fff;text-decoration:none;font-weight:600}
.pn a.next{margin-left:auto}
.foot{border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.foot p{margin:0;max-width:70ch}
.mv{margin-top:20px}
.mvl{flex:1 1 100%;font-weight:600;color:var(--ink)}
.mvt{flex:1 1 100%;font:14px/1.4 ui-monospace,monospace;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);overflow-wrap:anywhere}
.mvm{margin-top:10px;color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;margin-left:4px;border-radius:999px;background:var(--sun);color:#14172b;white-space:nowrap;vertical-align:1px}
.how{flex:1 1 100%;margin:0 0 10px 40px}
.how summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--link);min-height:36px;display:flex;align-items:center;width:max-content}
.how ol{margin:6px 0 0;padding-left:20px}
.how ol li{display:list-item;border:0;padding:3px 0;font-size:15px}
.how .res{margin-top:10px}
.certlink{display:inline-block;margin-top:6px;padding:8px 16px;border-radius:999px;background:var(--sun);color:#14172b;font-weight:600;text-decoration:none}
.left{padding-left:20px;margin:12px 0 0}
.left li{margin:4px 0}
.certctl{margin-top:20px}
.certctl label{display:block;font-weight:600;margin-bottom:8px}
#certname{flex:1 1 240px;min-height:44px;padding:0 12px;font:16px Inter,system-ui,sans-serif;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{margin:8px 0 0;font-size:14px;color:var(--mute)}
.cert{margin-top:28px;width:100%;aspect-ratio:297/210;display:grid;place-items:center;padding:7% 6%;text-align:center;background:#fff;color:#14172b;border:10px solid #2747d6;outline:2px solid #2747d6;outline-offset:-22px}
.cert.locked{filter:grayscale(1);opacity:.4}
.cin{width:100%;max-width:720px}
.ck{margin:0;font:800 clamp(18px,3vw,30px)/1.1 Archivo,sans-serif;color:#2747d6}
.cpre{margin:5% 0 0;font-size:clamp(12px,1.6vw,16px);color:#525873}
.cn{margin:.15em 0 .4em;padding-bottom:.15em;font:800 clamp(26px,5.4vw,54px)/1.1 Archivo,sans-serif;border-bottom:3px solid #ffc21a;overflow-wrap:anywhere}
.cb{margin:0 auto;max-width:58ch;font-size:clamp(12px,1.6vw,16px);line-height:1.5}
.cs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6%;align-items:end;margin-top:6%}
.cs>div:not(.seal){display:flex;flex-direction:column;gap:4px;font-size:clamp(11px,1.4vw,14px);color:#525873}
.line{min-height:1.7em;border-bottom:1.5px solid #14172b;color:#14172b;font-weight:600;font-size:clamp(12px,1.6vw,16px)}
.seal{width:clamp(58px,10vw,100px);aspect-ratio:1;border-radius:50%;display:grid;place-content:center;background:#ffc21a;color:#14172b;box-shadow:0 0 0 5px #fff,0 0 0 7px #ffc21a}
.seal b{font:800 clamp(18px,3.4vw,34px)/1 Archivo,sans-serif}
.seal span{font-size:clamp(10px,1.3vw,13px);font-weight:600}
.lockmsg{margin-top:12px;text-align:center;font-weight:600}
@media print{@page{size:A4 landscape;margin:0}html,body{background:#fff!important}.top,.foot,.noprint{display:none!important}.band{padding:0!important}.wk{max-width:none;margin:0}.cert{margin:0;width:100vw;height:100vh;aspect-ratio:auto;border-width:10mm;outline-offset:-16mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}.ck{font-size:26pt}.cpre{font-size:13pt}.cn{font-size:40pt}.cb{font-size:13pt}.cs>div:not(.seal){font-size:11pt}.line{font-size:13pt}.seal{width:28mm}.seal b{font-size:26pt}.seal span{font-size:10pt}}
@media(max-width:700px){.head{grid-template-columns:1fr}.sum{min-width:0}.meta{margin-left:40px}.topic{padding:18px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<div id="app"></div>
<script id="code">
{
const R={
AA:["Claude Academy (free courses)","https://academy.claude.com/"],
AIF:["AI Fluency course","https://academy.claude.com/courses/ai-fluency-framework-foundations"],
AICL:["AI capabilities and limitations course","https://academy.claude.com/courses/ai-capabilities-and-limitations"],

CCF:["Skills, hooks and more","https://code.claude.com/docs/en/features-overview"],

VSPY:["Python in VS Code tutorial","https://code.visualstudio.com/docs/python/python-tutorial"],

};
const W=[
{t:"Start here",s:"Start",goal:"Set yourself up so the next ten weeks run smoothly. You will do almost everything on your own, and save the parts that use Claude for one short Claude session each day.",hours:"About 1 hour",proj:"",topics:[
{h:"How this course works",why:"Each week has topics. Each topic explains what you are learning and why. Under each task, open How to do it for step-by-step instructions and links. Tick a task when you finish it, or press Reset to do it again.",tasks:[
{t:"Read this whole Start page"},
{t:"Click through Weeks 1 to 10 on the trail to see where you are heading"},
{t:"Choose your daily start time and write it down",how:["Pick a time you can keep most weekdays, for example 9:30 am.","Plan about 2 hours: around 90 minutes on your own, then a 30 minute Claude session.","Write the time on your journal's first page."]}]},
{h:"Your daily Claude session",why:"Claude accounts are for adults, so you use Claude on your parent's account. To keep you in charge of your own learning, you prepare everything first, then bring it to one short Claude session with your parent nearby. Tasks tagged Claude session are the only ones that need it.",tasks:[
{t:"Agree a daily Claude session time with your parent (about 30 minutes)"},
{t:"Make a Session list page in your journal",how:["Each day, write down every task tagged Claude session that you are up to.","Write your prompts in advance, so the session is spent using Claude, not thinking of what to type.","After the session, note what worked and what didn't."]},
{t:"Agree the Claude Code rule: only work inside your project folder, and check with your parent before approving anything that deletes or installs"},
{t:"Agree the privacy rule: never paste in passwords, addresses, phone numbers or other people's private information"},
{t:"Agree the school rule: Claude helps you learn, it does not do your schoolwork for you"}]},
{h:"Your learning journal",why:"Experts keep notes. Your journal is where you save great prompts, mistakes Claude made and how you caught them, and anything that confused you. By Week 10 it becomes your personal playbook.",tasks:[
{t:"Set up a notebook or document called My Claude Journal",how:["Use a paper notebook, or a document on your computer.","Make four sections: Great prompts, Claude got it wrong, Questions, Session list."]},
{t:"Write your first entry: what do you hope to build by the end of the holidays?"}]}
],check:["Which tasks need a Claude session?","What do you prepare before each session?"]},

{t:"How AI and Claude work",s:"How AI works",goal:"Understand what a large language model is, how it learns, and why it can sound confident but still be wrong.",hours:"About 10 hours",proj:"A poster explaining how a chatbot predicts words",topics:[
{h:"What is a large language model?",why:"Claude is a large language model (LLM). It learned patterns from huge amounts of text, and it writes by predicting what words should come next, over and over. Knowing this explains almost everything about how it behaves.",tasks:[
{t:"Enrol in the free AI Fluency course",how:["Open the AI Fluency course link.","Ask your parent to sign up with their email address (sign-up needs an adult).","Once signed in, you can do the lessons on your own."],links:[R.AIF]},
{t:"Complete the first two lessons of AI Fluency",how:["Watch or read each lesson fully.","Write one sentence in your journal about each lesson."],links:[R.AIF]},
{t:"Read chapter 1 of How AI Works",links:[R.HAW]},
{t:"Explain an LLM in three sentences, as if to a 9-year-old",how:["Write it in your journal.","Read it to someone at home. If they look confused, rewrite it."]}]},
{h:"Training, tokens and mistakes",why:"A model is trained once on lots of data, then used many times. It reads and writes in tokens, which are chunks of words. Because it predicts likely words rather than looking facts up, it can make up answers that sound right. This is called hallucination.",tasks:[
{t:"Read chapters 6 and 7 of How AI Works",links:[R.HAW]},
{t:"Do the token guessing game",how:["Write the sentence: Unbelievably, the hamster outran everyone.","Draw lines where you think it splits into tokens. Common short words are usually one token; long or rare words are often split into pieces.","Note in your journal why splitting words into pieces lets a model handle words it has never seen."]},
{t:"Write down three reasons an AI might give a wrong answer",how:["Think about: what it learned from, when its training ended, and the fact that it predicts likely words.","Check your answers against the AI Fluency lessons."],links:[R.AIF]},
{t:"Continue AI Fluency to the halfway point",links:[R.AIF]}]},
{h:"Meet the Claude family",why:"Claude comes in different sizes (Haiku is fast, Sonnet is balanced, Opus is the most capable) and is used through different products: the Claude app for chatting and making things, Claude Code for programming, and Claude Science for researchers.",tasks:[
{t:"Read the Meet the Claude models page and note what each model size is good for",links:[R.MOD]},
{t:"Make a products table in your journal",how:["Three columns: Product, What it does, Who it is for.","Rows: Claude app, Claude Code, Claude Science.","Use the models page and the Claude Science announcement to fill it in."],links:[R.MOD,R.SCI]},
{t:"Prepare five questions about a topic you know really well",how:["Pick a hobby, sport or game you are an expert in.","Write five detailed questions you already know the answers to.","Add them to your Session list."]},
{t:"Ask Claude your five questions and grade each answer out of 10",c:1,how:["In your Claude session, ask each question.","Mark each answer out of 10 and write down any mistakes in Claude got it wrong."],links:[R.CL]}]},
{h:"Friday project: the prediction poster",why:"Teaching something is the best test of whether you understand it.",tasks:[
{t:"Draw a poster showing how a chatbot predicts the next word",how:["Start with a half-finished sentence, for example: The cat sat on the...","Show three possible next words with a guessed chance for each (mat 60%, sofa 25%, moon 1%).","Show how the chosen word is added and the process repeats."]},
{t:"Present your poster to the family in under 5 minutes"},
{t:"Finish the AI Fluency course",links:[R.AIF]}]}
],check:["Why can an AI sound confident and still be wrong?","What is a token?","When would you choose Haiku instead of Opus?"]},

{t:"Prompting well",s:"Prompting",goal:"Write clear, structured prompts and explain why they work better than lazy ones.",hours:"About 10 hours",proj:"A before-and-after collection of 10 prompts",topics:[
{h:"How prompting works",why:"A prompt is everything you tell Claude. Anthropic publishes a guide to writing good prompts. You can learn all the techniques on your own, then test them in your Claude sessions.",tasks:[
{t:"Read the prompt engineering overview",links:[R.PEO]},
{t:"Read the General principles part of Prompting best practices",how:["Read one section a day: be clear and direct, add context, use examples, give Claude a role.","After each section, write the main idea in one sentence in your journal."],links:[R.PEB]},
{t:"Find the Claude 101 course in the course catalogue and work through it",how:["Open the catalogue and search for Claude 101.","Your parent may need to sign in for you; after that you can do it on your own."],links:[R.SKJ]}]},
{h:"Be clear, specific and give context",why:"Claude can't read your mind. The more it knows about your goal, your audience and what good looks like, the better the answer. Giving it a role (for example, you are a patient maths tutor) also helps.",tasks:[
{t:"Write a lazy prompt and an improved version",how:["Lazy: Tell me about volcanoes.","Improved: add who it is for (a Year 8 student), what you want (the 3 main types, with an example of each), and the length (under 200 words).","Write both in your journal and add them to your Session list."],links:[R.PEB]},
{t:"Write the same request with and without a role",how:["Without: Explain fractions.","With: You are a patient maths tutor who uses pizza examples. Explain fractions.","Add both to your Session list."]},
{t:"Test both pairs and compare the answers",c:1,how:["Run all four prompts in your Claude session.","Write which version was better and why."],links:[R.CL]}]},
{h:"Examples, formats and steps",why:"Showing Claude an example of what you want, asking for a specific format (a table, a list, a quiz), and splitting big jobs into steps are some of the most powerful tricks experts use.",tasks:[
{t:"Read the sections on examples and controlling the format",links:[R.PEB]},
{t:"Prepare a quiz prompt that includes one example question to copy",how:["Write one example question in exactly the style you want, including the answer options.","Then ask for 5 more questions like it on your topic."]},
{t:"Prepare a prompt that asks for a table",how:["Ask for the same information you'd normally get as a paragraph, but name the columns you want."]},
{t:"Run your example and table prompts, then ask Claude to check its own work",c:1,how:["Run both prompts.","Then ask: Check your last answer for mistakes and tell me what you find.","Note whether it found anything."],links:[R.CL]}]},
{h:"Friday project: 10 before-and-after prompts",why:"Practice turns tricks into habits.",tasks:[
{t:"Write 10 lazy prompts and improved versions over the week"},
{t:"Test them in your Claude sessions",c:1,links:[R.CL]},
{t:"Present your best pairs and explain what changed each time"}]}
],check:["Name four ways to improve a prompt.","Why does an example help Claude so much?"]},

{t:"Claude's features, limits and safety",s:"Features & safety",goal:"Use Claude's main features confidently, know its limits, and use it safely and honestly.",hours:"About 10 hours",proj:"A Project-based study helper and a fact-check challenge",topics:[
{h:"Projects and files",why:"A Project keeps files and instructions together, so Claude remembers the background every time you chat in it. It's perfect for a study helper.",tasks:[
{t:"Read about Projects in the Claude help centre",how:["Open the help centre and search for Projects.","Write down what a Project is and what you can put in one."],links:[R.HELP]},
{t:"Prepare notes and instructions for a study helper",how:["Choose a school topic and type up one page of notes.","Write project instructions, for example: Quiz me on these notes one question at a time and explain any I get wrong."]},
{t:"Create the Holiday study helper Project and use it to quiz yourself",c:1,links:[R.CL]}]},
{h:"Artifacts, research and voice",why:"Claude can make things you keep (documents, small apps, diagrams), search the web for current information, and talk with you by voice.",tasks:[
{t:"Read the help centre articles on artifacts and web search",links:[R.HELP]},

const KEY="claude-holiday-course-v2";
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let S={done:{},count:{}},canSave=true;
try{const l=JSON.parse(localStorage.getItem(KEY)||"null");if(l&&typeof l==="object")S={done:l.done||{},count:l.count||{},fin:l.fin||null}}catch(e){canSave=false}
const SHUT=new Set();let ask=null,move=null,moveMsg="",saveMsg=canSave?"Progress is saved in this browser on this device.":"This browser can't save progress (private window?). Use Copy my progress before closing.";
const id=(w,t,i)=>w+"-"+t+"-"+i;
const keys=w=>{const a=[];W[w].topics.forEach((tp,t)=>tp.tasks.forEach((x,i)=>a.push(id(w,t,i))));return a};
const ALL=W.map((x,w)=>keys(w));
const doneIn=w=>ALL[w].filter(k=>S.done[k]).length;
const parse=()=>{const h=location.hash.slice(1);if(h==="start")return 0;if(h==="certificate")return W.length;const m=/^week-(\d+)$/.exec(h);if(m){const n=+m[1];if(n>=1&&n<W.length)return n}return null};
let cur=parse();
if(cur===null){cur=ALL.findIndex(a=>a.some(k=>!S.done[k]));if(cur<0)cur=W.length}
const href=w=>"#"+(w===0?"start":w===W.length?"certificate":"week-"+w);
function head(){
const tot=ALL.reduce((n,a)=>n+a.length,0),d=ALL.reduce((n,a,w)=>n+doneIn(w),0),pct=Math.round(d/tot*100);
const stops=W.map((wk,w)=>{const p=Math.round(doneIn(w)/ALL[w].length*100);return '<li class="'+(p===100?"full":"")+'"><a class="stop'+(w===cur?" on":"")+'" href="'+href(w)+'" style="--p:'+p+'" aria-label="'+esc((w?"Week "+w+": ":"")+wk.t+", "+p+"% done")+'"'+(w===cur?' aria-current="step"':"")+'><span class="ring"><span class="num">'+(w?w:"S")+'</span></span><span class="lbl">'+esc(wk.s)+'</span></a></li>'}).join("")+'<li class="'+(d===tot?"full":"")+'"><a class="stop'+(cur===W.length?" on":"")+'" href="#certificate" style="--p:'+pct+'" aria-label="Certificate, '+(d===tot?"unlocked":"unlocks at 100%")+'"'+(cur===W.length?' aria-current="step"':"")+'><span class="ring"><span class="num"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg></span></span><span class="lbl">Certificate</span></a></li>';
return '<header class="band top"><div class="wrap head"><div><h1>Claude Holiday Course</h1><p class="lede">Ten weeks from beginner to confident builder. Pick a stop on the trail, work through each topic, and tick off tasks as you finish them.</p></div><div class="sum" aria-live="polite"><div class="big">'+pct+'%</div><p>'+d+' of '+tot+' tasks done</p><div class="bar"><i style="width:'+pct+'%"></i></div>'+(d===tot?'<p><a class="certlink" href="#certificate">Get your certificate</a></p>':"")+'<p class="save" id="save">'+esc(saveMsg)+'</p></div></div><nav class="trail" id="trail" aria-label="Course weeks"><ol>'+stops+'</ol></nav></header>'}
function week(){
const wk=W[cur],wd=doneIn(cur),wt=ALL[cur].length,pct=Math.round(wd/wt*100);
const reset=ask==="week"?'<span>Untick all '+wd+' completed tasks in this '+(cur?"week":"section")+'?</span><button class="btn hot" data-act="yesweek">Yes, reset</button><button class="btn" data-act="no">Cancel</button>':'<button class="btn" data-act="askweek"'+(wd?"":" disabled")+'>Reset this '+(cur?"week":"section")+'</button>';
const topics=wk.topics.map((tp,t)=>{const sess=tp.tasks.some(o=>o.c);return '<section class="topic"><div class="th"><h3>'+esc(tp.h)+'</h3>'+(sess?'<span class="pill">Includes a Claude session</span>':"")+'</div><p class="why">'+esc(tp.why)+'</p><ul class="tasks">'+tp.tasks.map((o,i)=>{const k=id(cur,t,i),on=!!S.done[k],n=S.count[k]||0;let note="";if(on&&n>1)note="Done "+n+" times";else if(!on&&n>0)note="Reset, done "+n+(n>1?" times":" time")+" before";const more=(o.how&&o.how.length)||(o.links&&o.links.length);return '<li class="'+(on?"done":"")+'"><label><input type="checkbox" id="c'+k+'" data-k="'+k+'"'+(on?" checked":"")+'><span>'+esc(o.t)+(o.c?' <span class="tag">Claude session</span>':"")+'</span></label>'+(note||on?'<span class="meta">'+(note?'<span class="cnt">'+note+'</span>':"")+(on?'<button class="rs" data-reset="'+k+'" aria-label="Reset task: '+esc(o.t)+'">Reset</button>':"")+'</span>':"")+(more?'<details class="how" data-d="'+k+'"'+(SHUT.has(k)?"":" open")+'><summary>'+(o.how&&o.how.length?"How to do it":"Links")+'</summary>'+(o.how&&o.how.length?'<ol>'+o.how.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>':"")+(o.links&&o.links.length?'<div class="res">'+o.links.map(r=>'<a href="'+esc(r[1])+'" target="_blank" rel="noopener">'+esc(r[0])+'</a>').join("")+'</div>':"")+'</details>':"")+'</li>'}).join("")+'</ul></section>'}).join("");
const chk=wk.check?'<section class="check"><h3>Can you answer these?</h3><ul>'+wk.check.map(q=>'<li>'+esc(q)+'</li>').join("")+'</ul></section>':"";
const pn='<nav class="pn">'+(cur>0?'<a href="'+href(cur-1)+'">Back: '+esc(cur-1?"Week "+(cur-1):"Start here")+'</a>':"")+(cur<W.length-1?'<a class="next" href="'+href(cur+1)+'">Next: Week '+(cur+1)+'</a>':'<a class="next" href="#certificate">Next: Your certificate</a>')+'</nav>';
return '<main class="band" id="main"><div class="wk"><p class="wn">'+(cur?"Week "+cur+" of 10":"Before you start")+'</p><h2>'+esc(wk.t)+'</h2><p class="goal">'+esc(wk.goal)+'</p><dl class="facts"><div><dt>Time</dt><dd>'+esc(wk.hours)+'</dd></div>'+(wk.proj?'<div><dt>Friday project</dt><dd>'+esc(wk.proj)+'</dd></div>':"")+'<div><dt>Progress</dt><dd>'+wd+' of '+wt+' tasks</dd></div></dl><div class="bar"><i style="width:'+pct+'%"></i></div><div class="acts">'+reset+'</div>'+topics+chk+pn+'</div></main>'}
function getName(){try{return localStorage.getItem(KEY+"-name")||""}catch(e){return ""}}
function fmtDate(iso){const d=iso?new Date(iso+"T12:00:00"):new Date();return d.toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"})}
function certView(){
const tot=ALL.reduce((n,a)=>n+a.length,0),d=ALL.reduce((n,a,w)=>n+doneIn(w),0),left=tot-d,all=left===0;
if(all&&!S.fin){S.fin=new Date().toISOString().slice(0,10);save()}
const nm=getName().trim();
const intro=all?'<p class="goal">You have finished all '+tot+' tasks. Type your name the way you want it to appear, then print your certificate or save it as a PDF.</p>':'<p class="goal">'+left+' of '+tot+' tasks to go. Finish every task to unlock your certificate.</p><ul class="left">'+W.map((w,i)=>{const r=ALL[i].length-doneIn(i);return r?'<li><a href="'+href(i)+'">'+esc(i?"Week "+i+": "+w.t:w.t)+'</a>, '+r+' left</li>':""}).join("")+'</ul>';
const ctl=all?'<div class="certctl"><label for="certname">Name on the certificate</label><div class="acts"><input id="certname" type="text" maxlength="60" value="'+esc(nm)+'" placeholder="Your full name" autocomplete="name"><button class="btn hot" data-act="print">Print certificate</button></div><p class="hint">In the print window, choose Landscape. To keep a digital copy, choose Save as PDF as the printer.</p></div>':"";
const cert='<div id="cert" class="cert'+(all?"":" locked")+'"'+(all?"":' aria-hidden="true"')+'><div class="cin"><p class="ck">Certificate of completion</p><p class="cpre">This certifies that</p><p class="cn" id="certout">'+esc(nm||"Your name")+'</p><p class="cb">has completed the 10-week Claude Holiday Course: '+tot+' tasks covering how AI works, prompting, features and safety, Python, Claude Code, the Claude API and Claude Science, finishing with a capstone project.</p><div class="cs"><div><span class="line">'+esc(all?fmtDate(S.fin):"")+'</span><span>Date completed</span></div><div class="seal"><b>10</b><span>weeks</span></div><div><span class="line"></span><span>Parent signature</span></div></div></div></div>';
return '<main class="band" id="main"><div class="wk"><div class="noprint"><p class="wn">The finish line</p><h2>'+(all?"You did it!":"Your certificate")+'</h2>'+intro+ctl+'</div>'+cert+(all?"":'<p class="lockmsg noprint">Your certificate unlocks at 100%.</p>')+'<nav class="pn noprint"><a href="'+href(W.length-1)+'">Back: Week 10</a></nav></div></main>'}
function foot(){
const all=ask==="all"?'<span>Untick every task in the whole course?</span><button class="btn hot" data-act="yesall">Yes, reset everything</button><button class="btn" data-act="no">Cancel</button>':'<button class="btn" data-act="askall">Reset whole course</button>';
let mv='<button class="btn" data-act="copy">Copy my progress</button><button class="btn" data-act="paste">Paste progress from another device</button>';
if(move==="copy")mv='<label class="mvl" for="mvout">Your progress code. Copy it, then paste it on the other device.</label><textarea id="mvout" class="mvt" readonly rows="3">'+esc(code())+'</textarea><button class="btn" data-act="no">Done</button>';
if(move==="paste")mv='<label class="mvl" for="mvin">Paste a progress code. This replaces the progress on this device.</label><textarea id="mvin" class="mvt" rows="3"></textarea><button class="btn hot" data-act="load">Load progress</button><button class="btn" data-act="no">Cancel</button>';
return '<footer class="band foot"><div class="wrap"><p>Tasks tagged Claude session use your parent\'s Claude account, so save them for your daily Claude session. Everything else you can do on your own. Resetting a task keeps a count of how many times you have done it. Progress lives in this browser, so clearing browsing data erases it.</p><div class="acts">'+all+'</div></div><div class="wrap mv"><div class="acts">'+mv+'</div>'+(moveMsg?'<p class="mvm" role="status">'+esc(moveMsg)+'</p>':"")+'</div></footer>'}
function code(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return ""}}
function loadCode(txt){try{const j=JSON.parse(decodeURIComponent(escape(atob(txt.trim()))));if(!j||typeof j.done!=="object"||typeof j.count!=="object")return false;S={done:j.done||{},count:j.count||{}};return true}catch(e){return false}}
const app=document.getElementById("app");
function render(focusId){
app.innerHTML=head()+(cur===W.length?certView():week())+foot();
if(focusId){const f=document.getElementById(focusId);if(f)f.focus({preventScroll:true})}
const tr=document.getElementById("trail"),on=tr&&tr.querySelector(".on");if(on)tr.scrollLeft=on.parentNode.offsetLeft-tr.clientWidth/2+on.parentNode.offsetWidth/2}
function setSave(m){saveMsg=m;const s=document.getElementById("save");if(s)s.textContent=m}
function save(){
if(ALL.some(a=>a.some(k=>!S.done[k])))delete S.fin;
try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){setSave("Couldn't save in this browser. Use Copy my progress so you don't lose it.")}}
app.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;if(e.target.checked){S.done[k]=1;S.count[k]=(S.count[k]||0)+1}else delete S.done[k];ask=null;save();if(e.target.checked&&ALL.every(a=>a.every(x=>S.done[x]))){location.hash="#certificate";return}render("c"+k)});
app.addEventListener("input",e=>{if(e.target.id!=="certname")return;const v=e.target.value;try{localStorage.setItem(KEY+"-name",v)}catch(x){}const o=document.getElementById("certout");if(o)o.textContent=v.trim()||"Your name"});
app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.reset){delete S.done[b.dataset.reset];save();render("c"+b.dataset.reset);return}
const a=b.dataset.act;
if(a==="print"){const n=document.getElementById("certname");if(n&&!n.value.trim()){n.focus();n.placeholder="Type your name first";return}window.print();return}
if(a==="askweek"){ask="week";render();return}
if(a==="askall"){ask="all";render();return}
if(a==="no"){ask=null;move=null;moveMsg="";render();return}
if(a==="copy"){move="copy";moveMsg="";render();const t=document.getElementById("mvout");if(t){t.focus();t.select()}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code()).then(()=>{moveMsg="Copied to the clipboard.";render()}).catch(()=>{moveMsg="Select the code above and copy it.";render()})}return}
if(a==="paste"){move="paste";moveMsg="";render("mvin");return}
if(a==="load"){const t=document.getElementById("mvin");if(t&&loadCode(t.value)){save();move=null;moveMsg="Progress loaded.";const n=ALL.findIndex(x=>x.some(k=>!S.done[k]));cur=n<0?W.length-1:n;render()}else{moveMsg="That code didn't work. Check you copied all of it.";const v=t?t.value:"";render();const t2=document.getElementById("mvin");if(t2){t2.value=v;t2.focus()}}return}
if(a==="yesweek"){ALL[cur].forEach(k=>delete S.done[k]);ask=null;save();render();return}
if(a==="yesall"){S.done={};delete S.fin;ask=null;save();render();return}});
app.addEventListener("toggle",e=>{const d=e.target;if(!d.dataset||!d.dataset.d)return;if(d.open)SHUT.delete(d.dataset.d);else SHUT.add(d.dataset.d)},true);
window.addEventListener("hashchange",()=>{const n=parse();if(n===null)return;cur=n;ask=null;render();const m=document.getElementById("main");if(m)window.scrollTo(0,Math.max(0,m.offsetTop-8))});
render();
}
</script>
</body>
</html>
